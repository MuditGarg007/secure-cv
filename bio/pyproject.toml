[project]
name = "bio"
version = "0.1.0"
description = "Face + gesture liveness service for Secure (internal, called only by web/)"
requires-python = "==3.12.*"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.143.0",
    "mediapipe>=0.10.35,<0.11",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
