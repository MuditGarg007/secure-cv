<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure: passwordless sign-in</title>
    <style>
      :root { --fg: #111; --muted: #666; --border: #e5e5e5; --bg: #fff; --accent: #111; --bad: #b91c1c; --good: #15803d; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); }
      header { border-bottom: 1px solid var(--border); }
      header div { max-width: 64rem; margin: 0 auto; padding: 12px 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
      main { max-width: 28rem; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
      h1 { font-size: 1.5rem; margin: 0; }
      h2 { font-size: 1.05rem; margin: 0; }
      p { margin: 0; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      button { height: 48px; width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 1rem; cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button:disabled { opacity: 0.5; }
      input { height: 44px; width: 100%; border-radius: 8px; border: 1px solid var(--border); padding: 0 12px; font-size: 1rem; }
      .card { border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .attacker { border: 2px dashed var(--bad); }
      .attacker h2 { color: var(--bad); }
      #log { background: #0b0b0b; color: #d4d4d4; font: 12px/1.45 ui-monospace, monospace; padding: 12px; border-radius: 8px;
             min-height: 12rem; max-height: 28rem; overflow: auto; white-space: pre-wrap; word-break: break-word; }
      .ok { color: #4ade80; } .bad { color: #f87171; } .info { color: #93c5fd; }
      .url { font: 12px ui-monospace, monospace; color: var(--muted); }
    </style>
  </head>
  <body>
    <header><div>🛡️ Secure</div></header>
    <main>
      <h1>Sign in</h1>
      <p class="muted">Sign in without passwords. Use your fingerprint, face or screen lock.</p>
      <button class="primary" id="a1">🔑 Sign in with passkey</button>
      <p class="url">This page is <b id="here"></b>, the real site is <b>__REAL_ORIGIN__</b> (rpID <b>__RP_ID__</b>).</p>

      <section class="card attacker">
        <h2>☠️ Attacker console</h2>
        <p class="muted">Each button tries one way to get a usable credential out of this look-alike page.</p>
        <button id="b1">1 · Ask for the real site's passkey (rpId "__RP_ID__")</button>
        <button id="b2">2 · Ask for a passkey for this site's own rpId</button>
        <button id="b3">3 · Relay with a forged origin (stolen key, server-side)</button>
        <button id="b4">4 · Relay the face check (/api/stepup/challenge)</button>
        <button id="b5">5 · Contrast: old-style password + OTP form</button>
        <form id="f5" class="card" hidden>
          <input name="handle" placeholder="Username" autocomplete="off" />
          <input name="password" type="password" placeholder="Password" autocomplete="off" />
          <input name="otp" inputmode="numeric" placeholder="SMS code" autocomplete="off" />
          <button class="primary" type="submit">Sign in</button>
        </form>
        <div id="log"></div>
      </section>
    </main>

    <script>
      const REAL_ORIGIN = "__REAL_ORIGIN__";
      const RP_ID = "__RP_ID__";
      document.getElementById("here").textContent = location.origin;
      const logEl = document.getElementById("log");
      function log(text, cls) {
        const line = document.createElement("div");
        if (cls) line.className = cls;
        line.textContent = text;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }
      const fromB64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));

      // A real challenge from the real site, relayed through this clone's proxy (falls back to random).
      async function realChallenge() {
        try {
          const r = await fetch("/api/auth/login/options", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
          if (r.ok) {
            const { options } = await r.json();
            log(`  relayed a real challenge from ${REAL_ORIGIN}: ${options.challenge.slice(0, 16)}…`, "info");
            return fromB64u(options.challenge);
          }
          log(`  real login/options answered ${r.status}; using a random challenge`, "info");
        } catch {}
        return crypto.getRandomValues(new Uint8Array(32));
      }

      async function askForPasskey(rpId) {
        const publicKey = { challenge: await realChallenge(), userVerification: "required", timeout: 30000 };
        if (rpId) publicKey.rpId = rpId;
        log(`  navigator.credentials.get({ publicKey: { rpId: ${rpId ? `"${rpId}"` : `(this site, "${location.hostname}")`} } })`);
        try {
          const cred = await navigator.credentials.get({ publicKey });
          log(`  ❌ browser returned a credential: ${cred && cred.id}`, "bad");
        } catch (e) {
          log(`  ✅ ${e.name}: ${e.message}`, "ok");
          log(`  Nothing released: passkeys only answer to the site they were made for.`, "ok");
        }
      }

      async function attack1() {
        log(`\n[1] Ask for the real site's passkey from ${location.origin}`);
        await askForPasskey(RP_ID);
      }
      async function attack2() {
        log(`\n[2] Ask for a passkey scoped to this clone's own rpId`);
        await askForPasskey(null);
        log(`  (On a real domain the browser would find no passkey for it; on a bare IP it refuses outright.)`, "info");
      }
      async function attack3() {
        log(`\n[3] Running attack3.mjs on the phishing server (takes a few seconds)…`);
        const b = document.getElementById("b3");
        b.disabled = true;
        try {
          const r = await fetch("/attack/3", { method: "POST" });
          const { exitCode, output } = await r.json();
          for (const line of output.trimEnd().split("\n")) {
            log(line, line.includes("✅") ? "ok" : /❌|💥/.test(line) ? "bad" : undefined);
          }
          log(exitCode === 0 ? "  attack 3 rejected as expected" : `  attack3.mjs exit ${exitCode}`, exitCode === 0 ? "ok" : "bad");
        } finally {
          b.disabled = false;
        }
      }
      async function attack4() {
        log(`\n[4] POST /api/stepup/challenge through the clone (no passkey session)`);
        const r = await fetch("/api/stepup/challenge", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
        const j = await r.json().catch(() => ({}));
        log(`  → HTTP ${r.status} ${JSON.stringify(j)}`, r.status === 401 ? "ok" : "bad");
        if (r.status === 401) log(`  ✅ No face check without a real passkey sign-in first, so there is nothing to relay.`, "ok");
      }
      function attack5() {
        log(`\n[5] Contrast: a fake password + SMS OTP form. Type anything and press Sign in.`);
        document.getElementById("f5").hidden = false;
      }
      document.getElementById("f5").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        await fetch("/attack/5", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
        log(`  ❌ captured in plain text: ${JSON.stringify(data)}`, "bad");
        log(`  A password and OTP work on the real site too. A passkey assertion from this page never does.`, "bad");
      });

      document.getElementById("a1").addEventListener("click", attack1);
      document.getElementById("b1").addEventListener("click", attack1);
      document.getElementById("b2").addEventListener("click", attack2);
      document.getElementById("b3").addEventListener("click", attack3);
      document.getElementById("b4").addEventListener("click", attack4);
      document.getElementById("b5").addEventListener("click", attack5);
    </script>
  </body>
</html>
